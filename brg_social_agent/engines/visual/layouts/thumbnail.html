<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1280px;
  height: 720px;
  overflow: hidden;
  font-family: '{{ brand.font_family }}', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
}

:root {
  --primary: {{ brand.primary_color }};
  --accent: {{ brand.accent_color }};
  {% if mood == "dark" %}
  --bg: var(--primary);
  --text-primary: #FFFFFF;
  --text-secondary: rgba(255, 255, 255, 0.65);
  {% else %}
  --bg: #FFFFFF;
  --text-primary: var(--primary);
  --text-secondary: rgba(26, 26, 46, 0.60);
  {% endif %}
}

body {
  background: var(--bg);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  padding: 60px 80px 56px;
  position: relative;
}

/* Left accent bar */
.accent-bar {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 10px;
  background: var(--accent);
}

.eyebrow {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 24px;
}

.hook-text {
  font-size: 80px;
  font-weight: 900;
  line-height: 1.04;
  letter-spacing: -0.035em;
  flex: 1;
  display: flex;
  align-items: center;
  max-width: 1020px;
}

.bottom-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-top: 32px;
}

.topic-label {
  font-size: 19px;
  font-weight: 500;
  color: var(--text-secondary);
  max-width: 680px;
  line-height: 1.45;
}

.brand-box {
  background: var(--accent);
  color: #FFFFFF;
  padding: 16px 32px;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 5px;
  white-space: nowrap;
  flex-shrink: 0;
}
</style>
</head>
<body>

<div class="accent-bar"></div>

<div class="eyebrow">Battle Rhythm Group &middot; Leadership</div>

<div class="hook-text">{{ hook_text }}</div>

<div class="bottom-bar">
  <p class="topic-label">{{ topic_title }}</p>
  <div class="brand-box">Watch Now</div>
</div>

</body>
</html>
