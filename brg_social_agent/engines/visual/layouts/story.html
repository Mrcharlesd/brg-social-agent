<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  font-family: '{{ brand.font_family }}', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
}

:root {
  --primary: {{ brand.primary_color }};
  --accent: {{ brand.accent_color }};
  {% if mood == "dark" %}
  --bg: var(--primary);
  --text-primary: #FFFFFF;
  --text-secondary: rgba(255, 255, 255, 0.65);
  {% else %}
  --bg: #FFFFFF;
  --text-primary: var(--primary);
  --text-secondary: rgba(26, 26, 46, 0.60);
  {% endif %}

  {% if frame_purpose == "hook" %}
  --frame-color: {{ brand.accent_color }};
  {% elif frame_purpose == "insight" %}
  --frame-color: #4A8FE2;
  {% else %}
  --frame-color: #27AE60;
  {% endif %}
}

body {
  background: var(--bg);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  padding: 88px 80px;
  position: relative;
}

/* Left accent bar */
.accent-bar {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 10px;
  background: var(--frame-color);
}

/* Top bar with progress */
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 88px;
}

.progress-track {
  display: flex;
  gap: 10px;
  flex: 1;
  margin-right: 24px;
}

.progress-segment {
  height: 5px;
  flex: 1;
  border-radius: 2.5px;
  {% if mood == "dark" %}
  background: rgba(255, 255, 255, 0.25);
  {% else %}
  background: rgba(26, 26, 46, 0.15);
  {% endif %}
}

.progress-segment.complete {
  {% if mood == "dark" %}
  background: #FFFFFF;
  {% else %}
  background: var(--primary);
  {% endif %}
}

.brg-label {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

/* Purpose badge */
.purpose-badge {
  display: inline-block;
  padding: 10px 24px;
  border: 2.5px solid var(--frame-color);
  border-radius: 100px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--frame-color);
  margin-bottom: 72px;
}

/* Main content */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.frame-text {
  font-size: 74px;
  font-weight: 900;
  line-height: 1.08;
  letter-spacing: -0.03em;
  max-width: 900px;
  margin-bottom: 52px;
}

.accent-rule {
  width: 72px;
  height: 7px;
  background: var(--frame-color);
  border-radius: 3.5px;
}

/* Bottom */
.bottom-bar {
  margin-top: 80px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.footer-hint {
  font-size: 18px;
  font-weight: 500;
  color: var(--text-secondary);
}
</style>
</head>
<body>

<div class="accent-bar"></div>

<div class="top-bar">
  <div class="progress-track">
    {% for i in range(3) %}
    <div class="progress-segment {% if i <= frame_index %}complete{% endif %}"></div>
    {% endfor %}
  </div>
  <span class="brg-label">BRG</span>
</div>

<div class="purpose-badge">
  {% if frame_purpose == "hook" %}Hook
  {% elif frame_purpose == "insight" %}Insight
  {% else %}Take Action
  {% endif %}
</div>

<div class="main-content">
  <p class="frame-text">{{ frame_text }}</p>
  <div class="accent-rule"></div>
</div>

<div class="bottom-bar">
  {% if frame_purpose == "cta" %}
  <span class="footer-hint">Follow Battle Rhythm Group</span>
  {% else %}
  <span class="footer-hint">Swipe &rarr;</span>
  {% endif %}
</div>

</body>
</html>
