[project]
name = "brg-social-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "praw>=7.7.1",
    "youtube-transcript-api>=0.6.2",
    "newspaper4k>=0.9.3",
    "pytrends>=4.9.2",
    "python-dotenv>=1.0.1",
    "APScheduler>=3.10.4",
    "httpx>=0.27.0",
    "tweepy>=4.14.0",
    "google-api-python-client>=2.136.0",
    "anthropic>=0.30.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.4",
    "Pillow>=10.4.0",
    "playwright>=1.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: mark test as integration test requiring playwright install chromium",
]
